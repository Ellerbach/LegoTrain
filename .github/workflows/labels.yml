name: Pull Request Labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Create missing labels
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t existing_labels < <(gh label list --limit 1000 --json name --jq '.[].name')

          labels=(
            "LegoTrain|1f6feb|LegoTrain application changes"
            "LegoInfrared|d73a4a|LegoInfrared firmware changes"
            "SignalSwitch|fbca04|SignalSwitch firmware changes"
            "TrainDetect|0e8a16|TrainDetect firmware changes"
            "DiscoveryMessageTests|5319e7|Discovery message test changes"
            "documentation|0075ca|Documentation changes"
            "cicd|6f42c1|Continuous integration and delivery changes"
            "dependency update|0366d6|Dependency and package updates"
          )

          for label in "${labels[@]}"; do
            IFS="|" read -r name color description <<< "$label"
            if ! printf '%s\n' "${existing_labels[@]}" | grep -Fxq "$name"; then
              gh label create "$name" --color "$color" --description "$description"
            fi
          done

      - name: Apply labels
        if: github.event_name == 'pull_request_target'
        uses: actions/labeler@v7
